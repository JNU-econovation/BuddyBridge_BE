spring:
  application:
    name: BuddyBridge

  datasource:
    url: jdbc:mariadb://${MARIA_HOST}:${MARIA_PORT}/${MARIA_DATABASE}
    username: ${MARIA_USER}
    password: ${MARIA_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 8
      connection-timeout: 30000 # connection 획득 시도 후 실패 시 대기 시간

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    defer-datasource-initialization: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: ${REDIS_PORT}

  sql:
    init:
      data-locations: classpath:data.sql

custom:
  jwt:
    access-secret-key: ${JWT_ACCESS_SECRET_KEY}
    refresh-secret-key: ${JWT_REFRESH_SECRET_KEY}
    access-token-expire-time: ${JWT_ACCESS_TOKEN_EXPIRE_TIME}
    refresh-token-expire-time: ${JWT_REFRESH_TOKEN_EXPIRE_TIME}

oauth:
  kakao:
    client-id: ${OAUTH_KAKAO_CLIENT_ID}
    url:
      auth-url: ${OAUTH_KAKAO_AUTH_URL}
      api-url: ${OAUTH_KAKAO_API_URL}
      redirect-url: ${OAUTH_KAKAO_REDIRECT_URI}
      logout-redirect-url: ${OAUTH_KAKAO_LOGOUT_REDIRECT_URI}
      front-url: ${OAUTH_KAKAO_FRONT_URL}

logging:
  level:
    org.springframework:
      transaction.interceptor: trace    # 트랜잭션 로그 설정

    p6spy: info

    study.learnsocket.auth.kakao: debug # FeignClient 로그 레벨 설정

  file: # 로그 파일 설정
    name: /app/application.log

# Register P6LogFactory to log JDBC events
decorator:
  datasource:
    p6spy:
      enable-logging: true

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: create

  sql:
    init:
      mode: always

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update

  sql:
    init:
      mode: never

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate

  sql:
    init:
      mode: never
